name: Node.js CI

on: 
    push:
        branches: [version-node]
    pull_request: 
        branches: [version-node]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
