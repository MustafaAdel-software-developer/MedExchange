services:
  database:
    image: 'postgres:17.2'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=medexchange_db
    ports:
      - 5435:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


    

   

